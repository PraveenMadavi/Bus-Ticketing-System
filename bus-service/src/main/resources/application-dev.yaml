#BUS-SERVICE-DEV

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/btsbusservice
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG