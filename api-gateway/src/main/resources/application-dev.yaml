# GATEWAY-DEV

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: bus-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/buses/**

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG