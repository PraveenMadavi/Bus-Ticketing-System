# GATEWAY-DEV

server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: status-route
              uri: http://localhost:8081
              predicates:
                - Path=/app/status

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG